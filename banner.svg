<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- a few connected nodes on the right -->
  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="930" y1="80" x2="1030" y2="140"/>
    <line x1="1030" y1="140" x2="980" y2="220"/>
    <line x1="1030" y1="140" x2="1120" y2="110"/>
    <line x1="980" y1="220" x2="1090" y2="230"/>
    <line x1="1120" y1="110" x2="1090" y2="230"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="930" cy="80" r="5" fill-opacity="0.6"/>
    <circle cx="1030" cy="140" r="7" fill="#818CF8"/>
    <circle cx="980" cy="220" r="5" fill-opacity="0.6"/>
    <circle cx="1120" cy="110" r="5" fill-opacity="0.6"/>
    <circle cx="1090" cy="230" r="6" fill-opacity="0.8"/>
  </g>

  <text x="80" y="140" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700">Sachintha Wijesundara</text>
  <rect x="80" y="162" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="210" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Artificial Intelligence  ·  Machine Learning  ·  Data Science</text>
</svg>
